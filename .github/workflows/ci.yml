# Check every pull request and push; deploy main to Cloudflare.
#
# Runtime secrets (LK_API_KEY, LK_PROJECT_ID, the GitHub OAuth pair,
# COOKIE_ENCRYPTION_KEY) live on the Worker in Cloudflare and are never seen
# here: `wrangler deploy` leaves existing secrets in place. This workflow
# holds only what it needs to deploy:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" token for this account
#   CLOUDFLARE_ACCOUNT_ID  the account the Worker lives in
# Both are repository secrets (Settings → Secrets and variables → Actions).

name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: Typecheck and bundle
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            # Bundles the Worker exactly as a deploy would, without uploading.
            # Catches what tsc can't: unresolvable imports, Workers-incompatible
            # modules, wrangler.jsonc mistakes.
            - run: npx wrangler deploy --dry-run --outdir dist

    deploy:
        name: Deploy to Cloudflare
        needs: check
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: production
        # One deploy at a time, in push order; never cancel one mid-upload.
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy
